name: portmone_bloc
description: "A new Flutter project."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.11.1

dependencies:
  build_runner: ^2.13.1
  collection: ^1.19.1
  file_picker: ^12.0.0-beta.1
  fl_chart: ^1.2.0
  flutter:
    sdk: flutter
  flutter_animate: ^4.5.2
  flutter_bloc: ^9.1.1
  flutter_svg: ^2.2.4
  freezed: ^3.2.5
  freezed_annotation: ^3.1.0
  go_router: ^17.1.0
  google_fonts: ^8.0.2
  intl: ^0.20.2
  path: ^1.9.1
  provider: ^6.1.5+1
  rxdart: ^0.28.0
  share_plus: ^13.1.0
  sqflite: ^2.4.2
  uid: ^0.1.1
  uuid: ^4.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/icons/  
    - assets/google_fonts/
  fonts:
    - family: Comfortaa
      fonts:
        - asset: assets/google_fonts/Comfortaa-Light.ttf
          weight: 300
        - asset: assets/google_fonts/Comfortaa-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/Comfortaa-Medium.ttf
          weight: 500
        - asset: assets/google_fonts/Comfortaa-Bold.ttf
          weight: 700
    - family: Montserrat
      fonts:
        - asset: assets/google_fonts/Montserrat-Regular.ttf
          weight: 400
        - asset: assets/google_fonts/Montserrat-Light.ttf
          weight: 300    
        - asset: assets/google_fonts/Montserrat-ExtraLight.ttf
          weight: 200
        - asset: assets/google_fonts/Montserrat-Thin.ttf
          weight: 100


